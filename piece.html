<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dragon Jar · Certificate</title>
<meta name="description" content="ข้อมูลประจำชิ้นของ Dragon Jug แต่ละใบ: ช่างผู้ปั้น วันที่ผลิต วัสดุ และเรื่องราว">
<link rel="icon" type="image/svg+xml" href="img/logo-jar-terra.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chonburi&family=Anuphan:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script>
(function(){
  var r=document.documentElement, l=null, t=null;
  try{l=new URLSearchParams(location.search).get('lang')}catch(e){}
  if(l!=='th'&&l!=='en'){try{l=localStorage.getItem('jar-lang')}catch(e){}}
  if(l==='th'||l==='en') r.setAttribute('lang',l);
  try{t=localStorage.getItem('jar-theme')}catch(e){}
  if(t==='light'||t==='dark') r.setAttribute('data-theme',t);
})();
</script>
<style>
/* Same tokens as the main Dragon Jar site */
:root{
  --bg:#1c1410;--surface:#271c16;--raised:#33251d;--fg:#f2e7d8;--muted:#bba893;
  --gold:#dca847;--clay:#c0603a;--celadon:#93b8a4;--line:rgba(242,231,216,.14);
  --font-display:"Chonburi","Noto Serif Thai",Georgia,serif;
  --font-body:"Anuphan","IBM Plex Sans Thai","Leelawadee UI","Tahoma",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f2ece3;--surface:#e8dfd2;--raised:#ded2c2;--fg:#2a1a12;--muted:#6a5445;
    --gold:#94660f;--clay:#9e4423;--celadon:#46705b;--line:rgba(42,26,18,.16);color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#f2ece3;--surface:#e8dfd2;--raised:#ded2c2;--fg:#2a1a12;--muted:#6a5445;
  --gold:#94660f;--clay:#9e4423;--celadon:#46705b;--line:rgba(42,26,18,.16);color-scheme:light;
}
html[lang="th"] .en, html[lang="en"] .th{display:none!important}
*{box-sizing:border-box}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:1.0625rem;line-height:1.7;min-height:100vh}
a{color:var(--gold)}
button:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:6px}
.wrap{max-width:720px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px))}

/* top bar */
.bar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:.75rem;padding-block:.7rem}
.brand{display:inline-flex;align-items:center;gap:.55rem;font-family:var(--font-display);font-size:1.05rem;color:var(--fg);text-decoration:none;white-space:nowrap}
.logo-mark{width:1.9rem;height:1.9rem;flex:none;display:block}
.logo-mark img{display:block;width:100%;height:100%;object-fit:contain}
.logo-mark .seal-l{display:none}
:root[data-theme="light"] .logo-mark .seal-d{display:none}
:root[data-theme="light"] .logo-mark .seal-l{display:block}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .logo-mark .seal-d{display:none}:root:not([data-theme="dark"]) .logo-mark .seal-l{display:block}}
.logo-slot{display:inline-grid;place-items:center;width:1.9rem;height:1.9rem;border-radius:50%;border:1.5px dashed var(--gold);color:var(--gold);font-family:var(--font-mono);font-size:.5rem;letter-spacing:.06em;flex:none}
.tools{display:flex;gap:.5rem;margin-left:auto}
.lang{display:inline-flex;padding:3px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.lang button{border:0;background:transparent;color:var(--muted);font-family:var(--font-mono);font-size:.78rem;letter-spacing:.06em;padding:.3rem .7rem;border-radius:999px;cursor:pointer;transition:background .3s,color .3s}
.lang button[aria-pressed="true"]{background:var(--gold);color:var(--bg)}
.theme-btn{display:inline-flex;align-items:center;justify-content:center;width:2.2rem;height:2.2rem;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.theme-btn:hover{border-color:var(--gold)}
.theme-btn .dot{width:.85rem;height:.85rem;border-radius:50%;background:linear-gradient(90deg,var(--fg) 50%,var(--bg) 50%);border:1px solid var(--muted)}

main{padding-block:2rem 3rem}

/* certificate card */
.cert{position:relative;border:1px solid var(--line);border-radius:20px;background:var(--surface);padding:1.6rem 1.5rem 1.4rem;overflow:hidden;animation:in .9s var(--ease) both}
.cert::before{content:"";position:absolute;inset:8px;border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);border-radius:14px;pointer-events:none}
@keyframes in{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.cert-top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap}
.crafted{font-family:var(--font-mono);font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:.4rem;padding:.25rem .75rem;border-radius:999px;font-size:.8rem;color:var(--celadon);background:color-mix(in srgb,var(--celadon) 14%,transparent);border:1px solid color-mix(in srgb,var(--celadon) 40%,transparent)}
.badge svg{width:.9rem;height:.9rem}
.serial{font-family:var(--font-mono);font-weight:500;font-size:clamp(2.6rem,10vw,3.6rem);line-height:1.1;letter-spacing:.02em;margin:.5rem 0 .2rem;color:var(--fg)}
.coll{font-family:var(--font-mono);font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.sample{margin-top:.8rem;display:inline-block;font-size:.78rem;color:var(--clay);border:1px dashed var(--clay);border-radius:6px;padding:.15rem .55rem}

table{width:100%;border-collapse:collapse;margin-top:1.4rem;font-size:.97rem}
th,td{text-align:left;padding:.75rem .2rem;border-bottom:1px solid var(--line);vertical-align:top}
thead th{font-weight:600;font-size:.85rem;color:var(--muted);border-bottom-color:color-mix(in srgb,var(--gold) 50%,transparent)}
tbody th{font-weight:400;color:var(--muted);width:38%;padding-right:1rem}
tbody tr{animation:in .7s var(--ease) both}
tbody tr:nth-child(1){animation-delay:.15s}tbody tr:nth-child(2){animation-delay:.2s}tbody tr:nth-child(3){animation-delay:.25s}
tbody tr:nth-child(4){animation-delay:.3s}tbody tr:nth-child(5){animation-delay:.35s}tbody tr:nth-child(6){animation-delay:.4s}
.sw{display:inline-block;width:.9rem;height:.9rem;border-radius:50%;vertical-align:-.1rem;margin-right:.45rem;border:1px solid var(--line)}

/* story */
.story{margin-top:1.6rem;display:grid;gap:.8rem;animation:in .9s var(--ease) .3s both}
.story h2{margin:0;font-family:var(--font-display);font-weight:400;font-size:1.35rem}
.story p{margin:0;color:var(--muted)}
.potter{display:flex;gap:.9rem;align-items:center;padding:1rem;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.avatar{width:3.2rem;height:3.2rem;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--raised);color:var(--gold);font-family:var(--font-display);font-size:1.3rem}
.potter b{display:block;font-weight:600}
.potter span{font-size:.88rem;color:var(--muted)}

.foot{margin-top:2rem;display:flex;flex-wrap:wrap;gap:.6rem}
.btn{display:inline-block;padding:.65rem 1.3rem;border-radius:999px;text-decoration:none;font-weight:500;font-size:.95rem}
.btn.primary{background:var(--gold);color:var(--bg)}
.btn.ghost{border:1px solid var(--line);color:var(--fg)}
.note{margin-top:1.4rem;font-size:.8rem;color:var(--muted)}

.missing{text-align:center;padding:3rem 1rem;display:grid;gap:.8rem;justify-items:center}
.missing h1{margin:0;font-family:var(--font-display);font-weight:400;font-size:1.6rem}
.missing p{margin:0;color:var(--muted)}
.missing .ids{display:flex;gap:.5rem}
</style>
</head>
<body>

<header class="bar">
  <div class="wrap">
    <a class="brand" href="index.html"><span class="logo-mark"><img class="seal-d" src="img/logo-jar-gold.svg" width="23" height="30" alt=""><img class="seal-l" src="img/logo-jar-brown.svg" width="23" height="30" alt=""></span>Dragon Jar</a>
    <div class="tools">
      <div class="lang" role="group" aria-label="Language / ภาษา">
        <button type="button" data-set-lang="th" aria-pressed="true">TH</button>
        <button type="button" data-set-lang="en" aria-pressed="false">EN</button>
      </div>
      <button class="theme-btn" id="theme-btn" type="button" aria-label="Light / dark"><span class="dot" aria-hidden="true"></span></button>
    </div>
  </div>
</header>

<main class="wrap" id="app"></main>

<script>
/* ===== ข้อมูลเหยือกแต่ละใบ — เพิ่มใบใหม่ได้โดยคัดลอกบล็อกแล้วเปลี่ยน id =====
   ข้อมูลทั้งหมดเป็นตัวอย่างสำหรับโครงงาน ไม่ใช่ช่างหรือสินค้าจริง */
var PIECES={
  'DR-001':{
    artisan:{th:'ช่างปั้น A (ข้อมูลตัวอย่าง)',en:'Potter A (sample data)'},
    initial:'A',
    since:{th:'ปั้นโอ่งมังกรมากว่า 25 ปี · อำเภอเมืองราชบุรี',en:'Making dragon jars for 25+ years · Mueang Ratchaburi'},
    date:{th:'2 พฤศจิกายน 2569',en:'2 November 2026'},
    material:{th:'ดินเหนียวราชบุรี',en:'Ratchaburi clay'},
    technique:{th:'ขึ้นรูปบนแป้นหมุน · ปั้นมังกรนูนด้วยมือ',en:'Wheel-thrown · hand-sculpted relief dragon'},
    size:{th:'สูง 22 ซม. × กว้าง 16 ซม.',en:'22 cm high × 16 cm wide'},
    color:{th:'น้ำตาลเคลือบขี้เถ้า · มังกรสีครีม',en:'Ash-glaze brown · cream dragon'},
    swatch:'linear-gradient(135deg,#a85d36 50%,#efe1cf 50%)',
    story:{th:'มังกรบนเหยือกใบนี้หันหน้าไปหาไข่มุกไฟ ซึ่งในคติจีนหมายถึงความมั่งคั่งและปัญญา ช่างใช้เวลาแต่งลายเกล็ดทีละเกล็ดประมาณ 2 วัน ก่อนนำเข้าเตาเผาพร้อมโอ่งใบใหญ่ในรอบเดียวกัน',
           en:'The dragon on this jug faces a flaming pearl, a Chinese symbol of wealth and wisdom. The potter spent about two days shaping the scales one by one before firing it alongside full-size jars in the same kiln.'}
  },
  'DR-002':{
    artisan:{th:'ช่างปั้น B (ข้อมูลตัวอย่าง)',en:'Potter B (sample data)'},
    initial:'B',
    since:{th:'ช่างรุ่นที่สองของครอบครัว · อำเภอโพธาราม',en:'Second-generation potter · Photharam'},
    date:{th:'9 พฤศจิกายน 2569',en:'9 November 2026'},
    material:{th:'ดินเหนียวราชบุรี',en:'Ratchaburi clay'},
    technique:{th:'ขึ้นรูปบนแป้นหมุน · เขียนลายเมฆด้วยดินขาว',en:'Wheel-thrown · cloud pattern painted in white slip'},
    size:{th:'สูง 24 ซม. × กว้าง 17 ซม.',en:'24 cm high × 17 cm wide'},
    color:{th:'ดำเคลือบเงา · มังกรสีทอง',en:'Glossy black · gold dragon'},
    swatch:'linear-gradient(135deg,#2a1d15 50%,#dcae52 50%)',
    story:{th:'เหยือกใบนี้ใช้สีดำลายทองแบบเดียวกับโอ่งมังกรรุ่นเก่าที่ครอบครัวช่างเคยทำ ลายเมฆรอบตัวเหยือกเขียนด้วยมือทั้งหมด จึงไม่มีใบไหนเหมือนกัน',
           en:'This jug uses the black-and-gold look of the older dragon jars the potter’s family once made. Every cloud around the body is painted by hand, so no two jugs match.'}
  }
};

(function(){
  var root=document.documentElement, app=document.getElementById('app');
  function lang(){return root.getAttribute('lang')==='en'?'en':'th'}
  function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function bi(o){return '<span class="th">'+esc(o.th)+'</span><span class="en">'+esc(o.en)+'</span>'}
  var id=null; try{id=(new URLSearchParams(location.search).get('id')||'').toUpperCase()}catch(e){}
  var p=PIECES[id];

  if(!p){
    app.innerHTML='<div class="missing"><h1>'+bi({th:'ไม่พบหมายเลขนี้',en:'Serial number not found'})+'</h1>'+
      '<p>'+bi({th:'ลองสแกน QR Code บนการ์ดอีกครั้ง หรือเลือกดูตัวอย่าง',en:'Try scanning the QR card again, or open a sample'})+'</p>'+
      '<div class="ids">'+Object.keys(PIECES).map(function(k){return '<a class="btn ghost" href="?id='+k+'">'+k+'</a>'}).join('')+'</div></div>';
  }else{
    var rows=[
      [{th:'ช่างผู้ปั้น',en:'Artisan'},bi(p.artisan)],
      [{th:'วันที่ผลิต',en:'Creation date'},bi(p.date)],
      [{th:'วัสดุ',en:'Material'},bi(p.material)],
      [{th:'เทคนิค',en:'Technique'},bi(p.technique)],
      [{th:'ขนาด',en:'Dimension'},bi(p.size)],
      [{th:'สีเคลือบ',en:'Colour'},'<span class="sw" style="background:'+p.swatch+'"></span>'+bi(p.color)]
    ];
    app.innerHTML=
      '<article class="cert" aria-labelledby="serial">'+
        '<div class="cert-top"><span class="crafted">Crafted in Ratchaburi</span>'+
        '<span class="badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-11"/></svg>Authentic Craft</span></div>'+
        '<h1 class="serial" id="serial">'+esc(id)+'</h1>'+
        '<span class="coll">Dragon Jug Collection</span><br>'+
        '<span class="sample">'+bi({th:'ข้อมูลตัวอย่างสำหรับโครงงาน GE012',en:'Sample data for the GE012 project'})+'</span>'+
        '<table><thead><tr><th>'+bi({th:'รายละเอียด',en:'Detail'})+'</th><th>'+bi({th:'ข้อมูล',en:'Information'})+'</th></tr></thead><tbody>'+
        rows.map(function(r){return '<tr><th scope="row">'+bi(r[0])+'</th><td>'+r[1]+'</td></tr>'}).join('')+
        '</tbody></table>'+
      '</article>'+
      '<section class="story">'+
        '<h2>'+bi({th:'เรื่องราวของเหยือกใบนี้',en:'The story of this jug'})+'</h2>'+
        '<div class="potter"><span class="avatar" aria-hidden="true">'+esc(p.initial)+'</span><div><b>'+bi(p.artisan)+'</b><span>'+bi(p.since)+'</span></div></div>'+
        '<p>'+bi(p.story)+'</p>'+
      '</section>'+
      '<div class="foot"><a class="btn primary" href="index.html#trip">'+bi({th:'มาดูช่างปั้นตัวจริง',en:'Visit the potters'})+'</a>'+
      '<a class="btn ghost" href="index.html">'+bi({th:'กลับหน้าหลัก Dragon Jar',en:'Back to Dragon Jar'})+'</a></div>'+
      '<p class="note">'+bi({th:'เหยือกทุกใบมีหมายเลขประจำชิ้นและ QR Code ของตัวเอง สแกนแล้วจะเห็นข้อมูลของใบนั้นเท่านั้น',en:'Every jug has its own serial number and QR code. Scanning it shows that jug only.'})+'</p>';
    document.title='Dragon Jar · '+id;
  }

  /* language */
  function setLang(l){
    root.setAttribute('lang',l);
    document.querySelectorAll('[data-set-lang]').forEach(function(b){b.setAttribute('aria-pressed',String(b.getAttribute('data-set-lang')===l))});
  }
  document.querySelectorAll('[data-set-lang]').forEach(function(b){
    b.addEventListener('click',function(){var l=b.getAttribute('data-set-lang');try{localStorage.setItem('jar-lang',l)}catch(e){}setLang(l)});
  });
  setLang(lang());

  /* theme */
  document.getElementById('theme-btn').addEventListener('click',function(){
    var t=root.getAttribute('data-theme');
    if(t!=='light'&&t!=='dark') t=window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';
    var n=t==='light'?'dark':'light'; root.setAttribute('data-theme',n);
    try{localStorage.setItem('jar-theme',n)}catch(e){}
  });
})();
</script>
</body>
</html>
